# Two-actor fleet: a trainable "main" solver plus a frozen "oracle" that hints when main's
# attempt looks wrong. See verl/experimental/multiagent/README.md for the full recipe writeup.

actors:
  main:
    actor_id: main
    system_prompt: >-
      You are solving a math word problem. Think step by step, then give a final numeric answer
      on its own line, prefixed with "Answer:".
    backend: trainable_verl
    engine_ref: main

  oracle:
    actor_id: oracle
    system_prompt: >-
      You are a math tutor. Read the student's latest attempt. If it looks wrong, give one short
      sentence pointing at the likely mistake without revealing the final answer. If it looks
      correct, say so briefly.
    backend: external_api
    engine_ref: oracle
    external_api:
      provider: openai
      model: gpt-4o-mini
      max_tokens: 128
      max_concurrency: 8
      timeout_s: 30.0
      max_retries: 2

# turn_order's length already equals max_turns, so every episode runs the full
# solve -> hint -> revise sequence. Early termination (e.g. stopping once main's answer is
# verified correct) needs an ActorBackend that sets ActorTurnResult.metrics["done"] -- v1's
# TrainableVerlActorBackend doesn't score correctness mid-episode, only the reward function does
# (after the episode ends) -- so termination_actor_id is left unset here.
policy:
  kind: rigid_sequence
  turn_order: [main, oracle, main]
  max_turns: 3
